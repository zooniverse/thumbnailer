name: Deploy to Staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create commit_id.txt
        run: echo ${{ github.sha }} > commit_id.txt

      - name: Build and push nginx thumbnailer image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zooniverse/thumbnailer:${{ github.sha }}
            ghcr.io/zooniverse/thumbnailer:latest
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push video thumbnailer image
        uses: docker/build-push-action@v4
        with:
          context: ./videos
          push: true
          tags: |
            ghcr.io/zooniverse/video-thumbnailer:${{ github.sha }}
            ghcr.io/zooniverse/video-thumbnailer:latest

  deploy_staging:
    needs: build_and_push_image
    name: Deploy to Staging
    uses: zooniverse/ci-cd/.github/workflows/deploy_app.yaml@main
    with:
      app_name: thumbnailer
      repo_name: thumbnailer
      commit_id: ${{ github.sha }}
      environment: staging
      deploy_check: false
    secrets:
      creds: ${{ secrets.AZURE_AKS }}

  slack_notification:
    name: Send Slack notification
    uses: zooniverse/ci-cd/.github/workflows/slack_notification.yaml@main
    needs: deploy_staging
    if: always()
    with:
      commit_id: ${{ github.sha }}
      job_name: Deploy to Staging / deploy_staging
      status: ${{ needs.deploy_staging.result }}
      title: 'Thumbnailer staging deploy complete'
      title_link: 'thumbnails.zooniverse.org'
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
